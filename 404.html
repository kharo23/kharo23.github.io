<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700&amp;family=Fraunces:opsz,wght@9..144,340;9..144,440;9..144,560;9..144,650&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Pagina non trovata | Kharonte Studio</title>
  <meta name="description" content="Pagina non trovata - Kharonte Studio. Scopri tutte le nostre app per iOS e Android.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://kharonte.dev/404.html">
  
  <link rel="icon" type="image/png" href="/assets/studio-favicon.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/products.css">
  
  <style>
    .error-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
      position: relative;
      z-index: 2;
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #38bdf8 0%, #0052ff 50%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 45px rgba(0, 82, 255, 0.4));
    }
    .error-card {
      max-width: 580px;
      background: var(--bg-card);
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-xl);
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .error-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    .error-desc {
      color: var(--text-secondary);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 4px 20px var(--primary-glow);
      transition: var(--transition);
    }
    .btn-primary-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 82, 255, 0.6);
    }
    .btn-secondary-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-highlight);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: var(--transition);
    }
    .btn-secondary-action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .quick-apps-row {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .quick-apps-row a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: var(--transition);
    }
    .quick-apps-row a:hover {
      color: var(--text-highlight);
    }
  </style>
  <script src="./hub-interactions.js" defer></script>
</head>
<body class="product-page hub-page">

  <!-- Background Canvas -->
  
  <div class="bg-grid-pattern" aria-hidden="true"></div>
  <div class="hero-mesh" aria-hidden="true">
    <div class="hero-mesh-blob b1"></div>
    <div class="hero-mesh-blob b2"></div>
    <div class="hero-mesh-blob b3"></div>
    <div class="hero-mesh-blob b4"></div>
    <div class="hero-mesh-blob b5"></div>
    <div class="hero-mesh-blob b6"></div>
  </div>
  <div class="hero-spotlight" aria-hidden="true"></div>

  <!-- Navigation Bar -->
  <header class="site-nav">
    <div class="container nav-inner">
      <a href="/" class="brand-wrapper">
        <img src="/assets/studio-icon.png" alt="Kharonte Studio" class="brand-logo-img">
        <span class="brand-name">Kharonte <span>Studio</span></span>
      </a>
      <div class="nav-right-group">
        <a href="/" class="nav-item-link">Home ↗</a>
      </div>
    </div>
  </header>

  <main class="error-wrapper">
    <div class="error-code">404</div>
    <div class="error-card">
      <h1 class="error-title">Pagina non trovata</h1>
      <p class="error-desc">
        Il percorso che stai cercando non esiste o è stato spostato.<br>
        <span style="font-size: 0.9rem; opacity: 0.85;">(The page you're looking for doesn't exist or has been moved.)</span>
      </p>

      <div class="error-actions">
        <a href="/" class="btn-primary-action">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Tutte le nostre App
        </a>
        <a href="/preventivi-facili/" class="btn-secondary-action">
          Preventivi Facili
        </a>
      </div>

      <div class="quick-apps-row">
        <a href="/foodlio/">Foodlio</a>
        <a href="/padel-match-manager/">Padel Match Manager</a>
        <a href="/aegis/">Aegis</a>
        <a href="/flipeven/">FlipEven</a>
        <a href="/support.html">Assistenza</a>
      </div>
    </div>
  </main>

</body>
</html>
